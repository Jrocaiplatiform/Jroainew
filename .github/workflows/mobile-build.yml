name: J-ROC Native Mobile Build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - run: npx tsc --noEmit

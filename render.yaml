services:
  - type: web
    name: jrocai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jrocai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        value: api.jrocai.online,jrocai-api.onrender.com
      - key: CORS_ORIGINS
        value: https://jrocai.online,https://www.jrocai.online
      - key: REQUIRE_HTTPS
        value: "false"
      - key: BRAIN_ENABLED
        value: "false"

databases:
  - name: jrocai-db
    plan: free
